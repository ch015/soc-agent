name: secops-soc-agent

x-app: &app
  image: ${SOC_AGENT_IMAGE:-secops-soc-agent:local}
  build: .
  environment: &environment
    DATABASE_URL: postgresql://soc:soc-local@postgres:5432/soc_agent
    REDIS_URL: redis://redis:6379
    PORT: "3001"
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: soc
      POSTGRES_PASSWORD: soc-local
      POSTGRES_DB: soc_agent
    ports: ["127.0.0.1:${SOC_POSTGRES_PORT:-55433}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soc -d soc_agent"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:${SOC_REDIS_PORT:-56380}:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    <<: *app
    command: ["node", "dist/scripts/migrate.js"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
  gateway:
    <<: *app
    ports: ["127.0.0.1:${SOC_HTTP_PORT:-3001}:3001"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/v1/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
  soc-worker:
    <<: *app
    command: ["node", "dist/src/gateway/workers/soc-entry.js"]
    environment:
      <<: *environment
      SIEM_BE_BASE_URL: ${SIEM_BE_BASE_URL:-http://host.docker.internal:8080}
      SIEM_BE_SERVICE_TOKEN: ${SIEM_BE_SERVICE_TOKEN:-}
      SOC_DATA_CONNECTOR: ${SOC_DATA_CONNECTOR:-nunchi-core}
      SOC_TOOL_CAPABILITIES: ${SOC_TOOL_CAPABILITIES:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SOC_LLM_MODEL: ${SOC_LLM_MODEL:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_CHANNEL_SOC: ${SLACK_CHANNEL_SOC:-#soc-alerts}
      SLACK_CHANNEL_CRITICAL: ${SLACK_CHANNEL_CRITICAL:-#soc-critical}
      SLACK_CHANNEL_HIGH: ${SLACK_CHANNEL_HIGH:-#soc-high}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-opus}
      DEFAULT_REVIEW_MODEL: ${DEFAULT_REVIEW_MODEL:-sonnet}
      PAGERDUTY_ROUTING_KEY: ${PAGERDUTY_ROUTING_KEY:-}
      INCIDENT_WEBHOOK_URL: ${INCIDENT_WEBHOOK_URL:-}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["engagements:/app/.nunchi"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  engagements:
